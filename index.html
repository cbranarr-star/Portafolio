<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio - Transición de Infraestructura a Analítica de Datos</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --panel: #FFFFFF;
      --panel-2: #F1F5F9;
      --line: #E2E8F0;
      --text: #0F172A;
      --muted: #64748B;
      --signal: #2E5AAC;
      --amber: #D97706;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    .diagram-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .diagram-card:hover {
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border-color: var(--line);
    }

    .btn-ghost:hover {
      background: var(--panel-2);
      color: var(--text);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- TARJETA ANIMADA: DEL SERVIDOR EN LLAMAS AL ANALIZADOR DE DATOS -->
    <div class="diagram-card tilt-card" style="padding: 20px; text-align: center;">
      <div class="diagram-head" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <div class="diagram-title" style="font-family: monospace; font-size: 11.5px; color: var(--muted); text-transform: uppercase;">
          Transición: Redes e Infraestructura ➔ BI & Datos
        </div>
        <div id="anim-status" class="diagram-status" style="font-family: monospace; font-size: 11px; color: var(--signal);">
          Servidor estable
        </div>
      </div>

      <svg id="story-svg" viewBox="0 0 500 240" style="width: 100%; height: auto; background: var(--panel-2); border-radius: 6px; border: 1px solid var(--line);">
        <defs>
          <!-- Gradientes decorativos -->
          <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2E5AAC" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#2E5AAC" stop-opacity="0.0"/>
          </linearGradient>
        </defs>

        <!-- Fondo de la habitación -->
        <line x1="0" y1="190" x2="500" y2="190" stroke="#CBD5E1" stroke-width="2" />
        <path d="M 0 190 L 500 190 L 500 240 L 0 240 Z" fill="#E2E8F0" opacity="0.4" />

        <!-- 1. SERVIDOR / PC (Izquierda) -->
        <g id="server-group" transform="translate(30, 80)">
          <!-- Rack de servidor -->
          <rect x="0" y="0" width="60" height="110" rx="4" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
          <rect x="6" y="10" width="48" height="18" rx="2" fill="#334155"/>
          <circle cx="14" cy="19" r="3" fill="#22C55E"/>
          <circle cx="22" cy="19" r="2" fill="#38BDF8"/>
          
          <rect x="6" y="34" width="48" height="18" rx="2" fill="#334155"/>
          <circle cx="14" cy="43" r="3" fill="#22C55E"/>
          
          <rect x="6" y="58" width="48" height="18" rx="2" fill="#334155"/>
          <circle cx="14" cy="67" r="3" fill="#EF4444" id="server-led-alert"/>

          <rect x="6" y="82" width="48" height="18" rx="2" fill="#334155"/>
          <circle cx="14" cy="91" r="3" fill="#22C55E"/>

          <!-- Fuego / Llamas (Ocultas al inicio) -->
          <g id="fire-group" opacity="0">
            <path d="M 15 10 C 10 -10, 25 -20, 30 -5 C 35 -25, 50 -15, 45 10 Z" fill="#EF4444">
              <animate attributeName="d" dur="0.3s" repeatCount="indefinite"
                values="M 15 10 C 10 -10, 25 -20, 30 -5 C 35 -25, 50 -15, 45 10 Z;
                        M 12 10 C 8 -15, 28 -25, 30 -8 C 38 -20, 48 -10, 47 10 Z;
                        M 15 10 C 10 -10, 25 -20, 30 -5 C 35 -25, 50 -15, 45 10 Z"/>
            </path>
            <path d="M 20 10 C 15 -2, 25 -10, 30 0 C 35 -12, 42 -5, 40 10 Z" fill="#F59E0B"/>
            <!-- Humo -->
            <circle cx="20" cy="-25" r="6" fill="#94A3B8" opacity="0.6">
              <animate attributeName="cy" from="-25" to="-50" dur="1s" repeatCount="indefinite"/>
              <animate attributeName="opacity" from="0.6" to="0" dur="1s" repeatCount="indefinite"/>
            </circle>
            <circle cx="35" cy="-30" r="8" fill="#94A3B8" opacity="0.5">
              <animate attributeName="cy" from="-30" to="-60" dur="1.2s" repeatCount="indefinite"/>
              <animate attributeName="opacity" from="0.5" to="0" dur="1.2s" repeatCount="indefinite"/>
            </circle>
          </g>
        </g>

        <!-- 2. ANALIZADOR DE GRÁFICOS / DATOS (Derecha) -->
        <g id="analytics-group" transform="translate(350, 70)">
          <!-- Pantalla / Monitor principal -->
          <rect x="0" y="0" width="110" height="80" rx="6" fill="#0F172A" stroke="#2E5AAC" stroke-width="2"/>
          <rect x="45" y="80" width="20" height="25" fill="#334155"/>
          <path d="M 30 105 L 80 105" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

          <!-- Gráficos en la pantalla -->
          <path d="M 10 60 L 30 45 L 50 50 L 70 25 L 90 35 L 100 20 L 100 65 L 10 65 Z" fill="url(#chartGrad)" />
          <path d="M 10 60 L 30 45 L 50 50 L 70 25 L 90 35 L 100 20" fill="none" stroke="#38BDF8" stroke-width="2" id="chart-line"/>
          
          <!-- Puntos de datos activados -->
          <circle cx="70" cy="25" r="3" fill="#38BDF8"/>
          <circle cx="100" cy="20" r="3" fill="#22C55E"/>

          <!-- Mini Barras de métricas -->
          <rect x="10" y="12" width="18" height="4" rx="1" fill="#94A3B8"/>
          <rect x="32" y="12" width="18" height="4" rx="1" fill="#94A3B8"/>
          
          <!-- Panel lateral flotante de métricas -->
          <rect x="75" y="-15" width="40" height="30" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.1))"/>
          <text x="80" y="-2" font-family="monospace" font-size="7" fill="#5C6B85">KPI OK</text>
          <text x="80" y="9" font-family="monospace" font-size="9" font-weight="bold" fill="#2E5AAC">+99.9%</text>
        </g>

        <!-- 3. PERSONAJE / MUÑECO (Posición adaptable por JS) -->
        <g id="character" transform="translate(180, 125)">
          <!-- Sombra -->
          <ellipse cx="15" cy="63" rx="12" ry="3" fill="#CBD5E1"/>

          <!-- Cuerpo -->
          <rect x="7" y="22" width="16" height="24" rx="4" fill="#2E5AAC"/>
          
          <!-- Cabeza -->
          <circle cx="15" cy="12" r="9" fill="#FCD34D"/>
          <!-- Ojos -->
          <circle cx="18" cy="10" r="1.2" fill="#1E293B"/>

          <!-- Piernas animadas -->
          <g id="legs">
            <line x1="10" y1="46" x2="10" y2="62" stroke="#1E293B" stroke-width="3" stroke-linecap="round" id="leg-left"/>
            <line x1="20" y1="46" x2="20" y2="62" stroke="#1E293B" stroke-width="3" stroke-linecap="round" id="leg-right"/>
          </g>

          <!-- Brazos -->
          <g id="arms">
            <line x1="7" y1="26" x2="0" y2="38" stroke="#2E5AAC" stroke-width="3" stroke-linecap="round" id="arm-left"/>
            <line x1="23" y1="26" x2="30" y2="38" stroke="#2E5AAC" stroke-width="3" stroke-linecap="round" id="arm-right"/>
          </g>

          <!-- Extintor (Oculto al inicio) -->
          <g id="extinguisher" opacity="0" transform="translate(22, 20)">
            <rect x="0" y="0" width="8" height="18" rx="2" fill="#EF4444"/>
            <rect x="2" y="-3" width="4" height="3" fill="#475569"/>
            <path d="M 2 -3 L -3 -6" stroke="#0F172A" stroke-width="1.5" fill="none"/>
            <!-- Espuma del extintor -->
            <g id="foam" opacity="0">
              <circle cx="-12" cy="-8" r="4" fill="#FFFFFF" opacity="0.8"/>
              <circle cx="-20" cy="-12" r="6" fill="#FFFFFF" opacity="0.9"/>
              <circle cx="-28" cy="-10" r="5" fill="#FFFFFF" opacity="0.7"/>
            </g>
          </g>
        </g>
      </svg>

      <button id="btn-replay" class="btn btn-ghost" style="margin-top: 12px; font-size: 11px; padding: 6px 14px;">
        🔄 Repetir simulación
      </button>
    </div>
  </div>

  <!-- SCRIPT DE CONTROL DE ANIMACIÓN -->
  <script>
  (function() {
    const char = document.getElementById('character');
    const fire = document.getElementById('fire-group');
    const extinguisher = document.getElementById('extinguisher');
    const foam = document.getElementById('foam');
    const statusText = document.getElementById('anim-status');
    const btnReplay = document.getElementById('btn-replay');
    const legLeft = document.getElementById('leg-left');
    const legRight = document.getElementById('leg-right');
    const armRight = document.getElementById('arm-right');

    let animationFrame;
    let isWalking = false;

    // Animación de caminar con piernas alternadas
    function stepLegs(t) {
      if (isWalking) {
        const angle = Math.sin(t * 0.015) * 8;
        legLeft.setAttribute('x2', 10 + angle);
        legRight.setAttribute('x2', 20 - angle);
      } else {
        legLeft.setAttribute('x2', 10);
        legRight.setAttribute('x2', 20);
      }
      animationFrame = requestAnimationFrame(stepLegs);
    }
    requestAnimationFrame(stepLegs);

    function moverPersonaje(targetX, duration) {
      return new Promise(resolve => {
        isWalking = true;
        const startX = parseFloat(char.getAttribute('transform').replace('translate(', '').split(',')[0]);
        const startTime = performance.now();

        function animate(time) {
          const elapsed = time - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const currentX = startX + (targetX - startX) * progress;
          
          char.setAttribute('transform', `translate(${currentX}, 125)`);

          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            isWalking = false;
            resolve();
          }
        }
        requestAnimationFrame(animate);
      });
    }

    async function ejecutarHistoria() {
      // Estado inicial
      char.setAttribute('transform', 'translate(180, 125)');
      fire.style.opacity = '0';
      extinguisher.style.opacity = '0';
      foam.style.opacity = '0';
      statusText.textContent = '1. Inspeccionando servidor...';
      statusText.style.color = 'var(--signal)';

      // PASO 1: El muñeco camina hacia el servidor
      await moverPersonaje(100, 2000);

      // PASO 2: ¡Incendio en el servidor!
      fire.style.opacity = '1';
      statusText.textContent = '2. ¡Fallo crítico! Incendio detectado';
      statusText.style.color = '#EF4444';
      await new Promise(r => setTimeout(r, 600));

      // PASO 3: Saca extintor y apaga el fuego
      extinguisher.style.opacity = '1';
      armRight.setAttribute('x2', 28);
      armRight.setAttribute('y2', 24); // Levanta la mano
      await new Promise(r => setTimeout(r, 400));
      
      foam.style.opacity = '1'; // Sale la espuma
      statusText.textContent = '3. Mitigando incidente con extintor...';
      await new Promise(r => setTimeout(r, 1500));

      // Apagar fuego y guardar extintor
      fire.style.opacity = '0';
      foam.style.opacity = '0';
      statusText.textContent = '4. Servidor estabilizado';
      statusText.style.color = 'var(--amber)';
      await new Promise(r => setTimeout(r, 800));

      extinguisher.style.opacity = '0';
      armRight.setAttribute('x2', 30);
      armRight.setAttribute('y2', 38);

      // PASO 4: Camina hacia el analizador de datos
      statusText.textContent = '5. Migrando a Analizador de Datos...';
      statusText.style.color = 'var(--signal)';
      await moverPersonaje(300, 2500);

      // PASO 5: Llegada al analizador y visualización
      statusText.textContent = '6. Analizando gráficos & KPIs ok';
      statusText.style.color = '#22C55E';
    }

    // Iniciar al cargar y al hacer clic en repetir
    ejecutarHistoria();
    if (btnReplay) {
      btnReplay.addEventListener('click', ejecutarHistoria);
    }
  })();
  </script>

</body>
</html>
